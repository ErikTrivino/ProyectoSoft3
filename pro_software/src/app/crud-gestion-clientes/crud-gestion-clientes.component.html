<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
</head>

<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header ps-5 pt-4 pb-4">
                <h5 class="mb-0"><i class="fa-solid fa-users me-3"></i>Gestión de Clientes</h5>
            </div>

            <div class="card-body p-5">
                <!-- Buscar cliente -->
                <div class="mb-3">
                    <input #search type="text" placeholder="Ingresar ID o nombre" class="form-control d-inline-block w-50 me-2" />
                    <button (click)="buscarCliente(search.value)" class="btn btn-primary">
                        <i class="fa-solid fa-search me-1"></i> Buscar
                    </button>
                </div>

                <!-- Tabla de clientes -->
                <div class="overflow-x-auto rounded-xl">
                    <table class="min-w-full bg-white border border-gray-200">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-2 text-left">Nombre</th>
                                <th class="px-4 py-2 text-left">Usuario</th>
                                <th class="px-4 py-2 text-left">Cédula</th>
                                <th class="px-4 py-2 text-left">Teléfono</th>
                                <th class="px-4 py-2 text-left">Email</th>
                                <th class="px-4 py-2">Acciones</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            <tr *ngFor="let cliente of clientes">
                                <td class="px-4 py-2">{{ cliente.nombrecompleto }}</td>
                                <td class="px-4 py-2">{{ cliente.username }}</td>
                                <td class="px-4 py-2">{{ cliente.cedula }}</td>
                                <td class="px-4 py-2">{{ cliente.telefono }}</td>
                                <td class="px-4 py-2">{{ cliente.email }}</td>
                                <td class="px-4 py-2">
                                    <button (click)="verInfoCliente(cliente)" class="btn btn-info">Ver info</button>
                                    <button (click)="editarCliente(cliente)" class="btn btn-warning">Editar</button>
                                    <button (click)="eliminarCliente(cliente.idusuario)" class="btn btn-danger">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Botón para agregar cliente -->
                <div class="mt-3 text-end">
                    <button (click)="abrirModalNuevoCliente()" class="btn btn-success">
                        <i class="fa-solid fa-user-plus me-1"></i> Agregar Cliente
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
